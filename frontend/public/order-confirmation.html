<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed — Ledger & Co.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/pages/variables.css">
  <link rel="stylesheet" href="css/pages/base.css">
  <link rel="stylesheet" href="css/pages/components.css">
  <link rel="stylesheet" href="css/pages/checkout.css">
  <link rel="stylesheet" href="css/pages/order.css">
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a href="index.html" class="brand">
        <span class="brand__mark" aria-hidden="true">L</span>
        Ledger&nbsp;&amp;&nbsp;Co.
      </a>
      <button class="theme-toggle" data-theme-toggle aria-pressed="false" aria-label="Toggle dark mode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main id="main">
    <div class="container" data-order-root>
      <div class="order-hero">
        <div class="order-hero__icon" aria-hidden="true">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <h1>Order confirmed</h1>
        <p>Thanks — a receipt is on its way to <span data-order-email>your inbox</span>.<br>
        Order <span class="order-hero__number" data-order-number>—</span></p>
      </div>

      <div class="order-card">
        <div data-order-items></div>
        <div class="summary-row summary-row--total" style="margin-top: var(--space-3);">
          <span>Total paid</span><span data-order-total>$0.00</span>
        </div>
      </div>

      <div class="order-card">
        <div class="eyebrow" style="margin-bottom: var(--space-2);">Shipping to</div>
        <p data-order-address style="font-size: var(--text-sm); color: var(--color-ink-soft);"></p>
      </div>

      <div style="text-align: center; display: flex; gap: var(--space-3); justify-content: center; margin-bottom: var(--space-8);">
        <a href="shop.html" class="btn btn-ghost">Continue shopping</a>
        <a href="order-tracking.html" data-track-link class="btn btn-primary">Track this order</a>
      </div>
    </div>
  </main>

  <script src="js/utils/format.js"></script>
  <script src="js/pages/order-confirmation.js"></script>
  <script src="js/utils/theme.js"></script>
</body>
</html>
