<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Wishlist — Ledger & Co.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/pages/variables.css">
  <link rel="stylesheet" href="css/pages/base.css">
  <link rel="stylesheet" href="css/pages/components.css">
  <link rel="stylesheet" href="css/pages/cart.css">
</head>
<body>

  <a class="visually-hidden" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container site-header__inner">
      <a href="index.html" class="brand">
        <span class="brand__mark" aria-hidden="true">L</span>
        Ledger&nbsp;&amp;&nbsp;Co.
      </a>
      <nav class="main-nav" aria-label="Primary">
        <a href="shop.html">Shop</a>
        <a href="shop.html?filter=new">New Arrivals</a>
        <a href="shop.html?filter=sale">Sale</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="header-actions">
        <button class="theme-toggle" data-theme-toggle aria-pressed="false" aria-label="Toggle dark mode">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <a href="account.html" class="icon-btn" aria-label="Account">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
        </a>
        <a href="wishlist.html" class="icon-btn" aria-label="Wishlist, 0 items">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
          <span class="icon-btn__count" data-wishlist-count>0</span>
        </a>
        <a href="cart.html" class="icon-btn" aria-label="Cart, 0 items">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
          <span class="icon-btn__count" data-cart-count>0</span>
        </a>
      </div>
    </div>
  </header>

  <main id="main">
    <div class="container" style="padding-block: var(--space-6) var(--space-8);">
      <nav class="breadcrumb" aria-label="Breadcrumb"><a href="index.html">Home</a> / Wishlist</nav>
      <h1 style="font-size: var(--text-3xl); margin-top: var(--space-3); margin-bottom: var(--space-6);">Your wishlist</h1>

      <div class="product-grid" data-wishlist-grid></div>

      <div class="cart-empty" data-wishlist-empty style="display: none;">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        <h2>Nothing saved yet</h2>
        <p>Tap the heart icon on any product to save it here.</p>
        <a href="shop.html" class="btn btn-primary">Browse products</a>
      </div>
    </div>
  </main>

  <script src="js/utils/theme.js"></script>
  <script src="js/utils/format.js"></script>
  <script src="js/data/sample-products.js"></script>
  <script src="js/utils/cartState.js"></script>
  <script src="js/utils/wishlistState.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/headerActions.js"></script>
  <script src="js/components/productCard.js"></script>
  <script src="js/pages/wishlist.js"></script>
</body>
</html>
