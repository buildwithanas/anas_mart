<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Ledger & Co.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/pages/variables.css">
  <link rel="stylesheet" href="css/pages/base.css">
  <link rel="stylesheet" href="css/pages/components.css">
  <link rel="stylesheet" href="css/pages/checkout.css">
  <link rel="stylesheet" href="css/pages/auth.css">
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a href="index.html" class="brand">
        <span class="brand__mark" aria-hidden="true">L</span>
        Ledger&nbsp;&amp;&nbsp;Co.
      </a>
      <button class="theme-toggle" data-theme-toggle aria-pressed="false" aria-label="Toggle dark mode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main>
    <div class="auth-wrap">
      <div class="auth-card">
        <h1>Create your account</h1>
        <p class="auth-card__sub">Faster checkout, order tracking, and wishlist saved across visits.</p>

        <form data-register-form novalidate>
          <div class="field">
            <label for="fullName">Full name</label>
            <input id="fullName" name="fullName" required autocomplete="name">
            <span class="field-error">Enter your name</span>
          </div>
          <div class="field">
            <label for="rEmail">Email</label>
            <input id="rEmail" name="email" type="email" required autocomplete="email">
            <span class="field-error">Enter a valid email</span>
          </div>
          <div class="field">
            <label for="rPassword">Password</label>
            <input id="rPassword" name="password" type="password" required minlength="8" autocomplete="new-password" data-password-input>
            <div class="password-strength">
              <span class="password-strength__bar" data-strength-bar></span>
              <span class="password-strength__bar" data-strength-bar></span>
              <span class="password-strength__bar" data-strength-bar></span>
              <span class="password-strength__bar" data-strength-bar></span>
            </div>
            <span class="field-error">Minimum 8 characters</span>
          </div>
          <div class="field">
            <label for="confirmPassword">Confirm password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" required autocomplete="new-password">
            <span class="field-error">Passwords don't match</span>
          </div>

          <div class="auth-row">
            <label><input type="checkbox" required> I agree to the Terms of Service</label>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Create account</button>
        </form>

        <p class="auth-footer">Already have an account? <a href="login.html">Sign in</a></p>
      </div>
    </div>
  </main>

  <script src="js/utils/theme.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/pages/auth.js"></script>
</body>
</html>
