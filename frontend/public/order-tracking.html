<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Your Order — Ledger & Co.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/pages/variables.css">
  <link rel="stylesheet" href="css/pages/base.css">
  <link rel="stylesheet" href="css/pages/components.css">
  <link rel="stylesheet" href="css/pages/checkout.css">
  <link rel="stylesheet" href="css/pages/order.css">
  <link rel="stylesheet" href="css/pages/shop.css">
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a href="index.html" class="brand">
        <span class="brand__mark" aria-hidden="true">L</span>
        Ledger&nbsp;&amp;&nbsp;Co.
      </a>
      <button class="theme-toggle" data-theme-toggle aria-pressed="false" aria-label="Toggle dark mode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main id="main">
    <div class="container" style="padding-block: var(--space-7);">
      <div style="text-align: center; margin-bottom: var(--space-6);">
        <h1 style="font-size: var(--text-3xl);">Track your order</h1>
        <p style="color: var(--color-ink-soft); margin-top: var(--space-2);">Enter your order number to see live status.</p>
      </div>

      <form class="lookup-form" data-lookup-form>
        <label class="visually-hidden" for="lookup">Order number</label>
        <input id="lookup" data-lookup-input placeholder="e.g. LC-48213092" autocomplete="off">
        <button type="submit" class="btn btn-primary">Track</button>
      </form>

      <div data-tracking-result></div>
    </div>
  </main>

  <script src="js/utils/theme.js"></script>
  <script src="js/utils/format.js"></script>
  <script src="js/pages/order-tracking.js"></script>
</body>
</html>
