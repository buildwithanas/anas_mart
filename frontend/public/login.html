<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Ledger & Co.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/pages/variables.css">
  <link rel="stylesheet" href="css/pages/base.css">
  <link rel="stylesheet" href="css/pages/components.css">
  <link rel="stylesheet" href="css/pages/checkout.css">
  <link rel="stylesheet" href="css/pages/auth.css">
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a href="index.html" class="brand">
        <span class="brand__mark" aria-hidden="true">L</span>
        Ledger&nbsp;&amp;&nbsp;Co.
      </a>
      <button class="theme-toggle" data-theme-toggle aria-pressed="false" aria-label="Toggle dark mode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main>
    <div class="auth-wrap">
      <div class="auth-card">
        <h1>Welcome back</h1>
        <p class="auth-card__sub">Sign in to track orders, manage your wishlist, and check out faster.</p>

        <form data-login-form novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required autocomplete="email">
            <span class="field-error">Enter a valid email</span>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required autocomplete="current-password">
            <span class="field-error">Enter your password</span>
          </div>

          <div class="auth-row">
            <label><input type="checkbox" name="remember"> Remember me</label>
            <a href="forgot-password.html">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Sign in</button>
        </form>

        <div class="auth-divider">or</div>
        <button class="btn btn-ghost btn-block">Continue with Google</button>

        <p class="auth-footer">Don't have an account? <a href="register.html">Create one</a></p>
      </div>
    </div>
  </main>

  <script src="js/utils/theme.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/pages/auth.js"></script>
</body>
</html>
